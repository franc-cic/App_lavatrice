<!DOCTYPE html>
<html>
<head>
  <title>Lavatrice</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 50px;
    }
    button {
      width: 200px;
      height: 100px;
      font-size: 18px;
      margin: 10px;
      border: none;
      border-radius: 15px;
      color: white;
    }
    .blue {
      background-color: blue;
    }
    .green {
      background-color: green;
    }
  </style>
</head>
<body>

<h1>Promemoria Lavatrice</h1>

<button id="detersivo" class="blue" onclick="toggle(this)">
  Detersivo
</button>

<button id="lavatrice" class="blue" onclick="toggle(this)">
  Avvia Lavatrice
</button>

<br><br>

<button onclick="mostraStorico()">Mostra Storico</button>

<ul id="history"></ul>

<script>
  let history = [];

  function toggle(btn) {
    if (btn.classList.contains("blue")) {
      btn.classList.remove("blue");
      btn.classList.add("green");

      let now = new Date().toLocaleString();
      history.unshift(btn.innerText + " - " + now);
    }
  }

  function mostraStorico() {
    let list = document.getElementById("history");
    list.innerHTML = "";
    history.forEach(item => {
      let li = document.createElement("li");
      li.innerText = item;
      list.appendChild(li);
    });
  }
</script>

</body>
</html>
