<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lavatrice Pro</title>
<style>
body {
  font-family: -apple-system, BlinkMacSystemFont;
  background: linear-gradient(180deg, #0a1f44, #014f86);
  color: white;
  text-align: center;
  margin: 0;
  padding: 20px;
}

h1 { margin-bottom: 20px; }

.container {
  display: flex;
  justify-content: center;
  gap: 15px;
  flex-wrap: wrap;
}

.col {
  width: 45%;
  max-width: 200px;
}

button {
  width: 100%;
  height: 110px;
  font-size: 18px;
  border: none;
  border-radius: 25px;
  background: #1ea7fd;
  color: white;
  position: relative;
  overflow: hidden;
}

ul {
  list-style: none;
  padding: 0;
}

li {
  background: rgba(255,255,255,0.1);
  padding: 6px;
  margin-top: 5px;
  border-radius: 10px;
  font-size: 11px;
}

.bubble, .flow {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
}
</style>
</head>
<body>

<h1>Lavatrice</h1>

<div class="container">

  <div class="col">
    <button onclick="pressDetersivo(this)">Detersivo</button>
    <ul id="histDet"></ul>
  </div>

  <div class="col">
    <button onclick="pressLavatrice(this)">Avvia</button>
    <ul id="histLav"></ul>
  </div>

</div>

<script>

function addHistory(id, text) {
  let list = document.getElementById(id);
  let li = document.createElement("li");
  li.innerText = text + " - " + new Date().toLocaleTimeString();
  list.prepend(li);

  // limita a 8 elementi
  if (list.children.length > 8) {
    list.removeChild(list.lastChild);
  }
}

function flash(btn) {
  btn.style.background = '#00c3ff';
  setTimeout(() => btn.style.background = '#1ea7fd', 250);
}

function pressDetersivo(btn) {
  flash(btn);
  addHistory("histDet", "Detersivo");
  flowEffect(btn);
}

function pressLavatrice(btn) {
  flash(btn);
  addHistory("histLav", "Avvio");
  bubbleEffect(btn);
}

function bubbleEffect(btn) {
  for (let i = 0; i < 10; i++) {
    let b = document.createElement("div");
    b.className = "bubble";
    b.style.width = b.style.height = Math.random()*10+5 + "px";
    b.style.left = Math.random()*100 + "%";
    b.style.bottom = "0";
    b.style.background = "rgba(255,255,255,0.7)";
    btn.appendChild(b);

    b.animate([
      { transform: "translateY(0)" },
      { transform: "translateY(-100px)", opacity: 0 }
    ], { duration: 800 }).onfinish = () => b.remove();
  }
}

function flowEffect(btn) {
  for (let i = 0; i < 8; i++) {
    let f = document.createElement("div");
    f.className = "flow";
    f.style.width = f.style.height = "6px";
    f.style.left = "0";
    f.style.top = Math.random()*100 + "%";
    f.style.background = "#00c3ff";
    btn.appendChild(f);

    f.animate([
      { transform: "translateX(0)" },
      { transform: "translateX(200px)", opacity: 0 }
    ], { duration: 500 }).onfinish = () => f.remove();
  }
}

</script>

</body>
</html>
