<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lavatrice Pro</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#014f86">

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont;
  background: linear-gradient(180deg, #0a1f44, #014f86);
  color: white;
  text-align: center;
  margin: 0;
  padding: 20px;
}

h1 { margin-bottom: 20px; }

.container {
  display: flex;
  justify-content: center;
  gap: 15px;
  flex-wrap: wrap;
}

.col {
  width: 45%;
  max-width: 200px;
}

button {
  width: 100%;
  height: 110px;
  font-size: 18px;
  border: none;
  border-radius: 25px;
  background: #1ea7fd;
  color: white;
  position: relative;
  overflow: hidden;
}

ul {
  list-style: none;
  padding: 0;
}

li {
  background: rgba(255,255,255,0.1);
  padding: 6px;
  margin-top: 5px;
  border-radius: 10px;
  font-size: 11px;
}

.bubble {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
}
</style>
</head>

<body>

<h1>Lavatrice</h1>

<div class="container">

  <div class="col">
    <button onclick="pressDetersivo(this)">Detersivo</button>
    <ul id="histDet"></ul>
  </div>

  <div class="col">
    <button onclick="pressLavatrice(this)">Avvia</button>
    <ul id="histLav"></ul>
  </div>

</div>

<script>

// 🔹 carica dati salvati
let histDet = JSON.parse(localStorage.getItem("histDet")) || [];
let histLav = JSON.parse(localStorage.getItem("histLav")) || [];

// 🔹 mostra storico all'avvio
window.onload = () => {
  render("histDet", histDet);
  render("histLav", histLav);
};

function render(id, data) {
  let list = document.getElementById(id);
  list.innerHTML = "";
  data.forEach(item => {
    let li = document.createElement("li");
    li.innerText = item;
    list.appendChild(li);
  });
}

function save() {
  localStorage.setItem("histDet", JSON.stringify(histDet));
  localStorage.setItem("histLav", JSON.stringify(histLav));
}

// ✅ SOLO ORA (senza testo)
function addHistory(type) {
  let now = new Date().toLocaleString("it-IT");

  if (type === "histDet") {
    histDet.unshift(now);
    histDet = histDet.slice(0, 8);
  } else {
    histLav.unshift(now);
    histLav = histLav.slice(0, 8);
  }

  save();
  render("histDet", histDet);
  render("histLav", histLav);
}

function flash(btn) {
  btn.style.background = '#00c3ff';
  setTimeout(() => btn.style.background = '#1ea7fd', 250);
}

// 🔹 DETERSIVO → effetto cascata
function pressDetersivo(btn) {
  flash(btn);
  addHistory("histDet");
  cascadeEffect(btn);
}

// 🔹 LAVATRICE → bolle
function pressLavatrice(btn) {
  flash(btn);
  addHistory("histLav");
  bubbleEffect(btn);
}

// 🔹 CASCATA (gocce che scendono)
function cascadeEffect(btn) {
  for (let i = 0; i < 15; i++) {
    let drop = document.createElement("div");
    drop.className = "bubble";
    drop.style.width = drop.style.height = Math.random()*6+4 + "px";
    drop.style.left = Math.random()*100 + "%";
    drop.style.top = "-10px";
    drop.style.background = "rgba(255,255,255,0.8)";

    btn.appendChild(drop);

    drop.animate([
      { transform: "translateY(0)", opacity: 1 },
      { transform: "translateY(120px)", opacity: 0 }
    ], {
      duration: 400 + Math.random()*300,
      easing: "ease-in"
    }).onfinish = () => drop.remove();
  }
}

// 🔹 BOLLE (unchanged)
function bubbleEffect(btn) {
  for (let i = 0; i < 12; i++) {
    let b = document.createElement("div");
    b.className = "bubble";
    b.style.width = b.style.height = Math.random()*12+6 + "px";
    b.style.left = Math.random()*100 + "%";
    b.style.bottom = "0";
    b.style.background = "rgba(255,255,255,0.75)";
    btn.appendChild(b);

    b.animate([
      { transform: "translateY(0) scale(1)", opacity: 1 },
      { transform: "translateY(-120px) scale(1.5)", opacity: 0 }
    ], {
      duration: 700 + Math.random()*300
    }).onfinish = () => b.remove();
  }
}

</script>

</body>
</html>
